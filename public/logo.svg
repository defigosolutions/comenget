<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A5F" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>
  <!-- Stylized Hair Shear / Letter 'J' & 'S' Icon -->
  <g transform="translate(10, 10)">
    <!-- Scissor handle loop left -->
    <circle cx="45" cy="40" r="18" fill="none" stroke="url(#logo-grad)" stroke-width="6" />
    <!-- Scissor handle loop right -->
    <circle cx="45" cy="80" r="18" fill="none" stroke="url(#logo-grad)" stroke-width="6" />
    <!-- Scissor blade top/cross -->
    <path d="M 50 45 L 85 75" stroke="url(#logo-grad)" stroke-width="6" stroke-linecap="round" />
    <!-- Scissor blade bottom/cross -->
    <path d="M 50 75 L 105 35" stroke="url(#logo-grad)" stroke-width="6" stroke-linecap="round" />
    <!-- Pivot screw -->
    <circle cx="65" cy="58" r="4" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="135" y="62" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" letter-spacing="0.05em">JAYSON</text>
  <text x="135" y="90" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#8B5CF6" letter-spacing="0.4em">HAIR SALON</text>
</svg>
